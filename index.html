<style>
  :root{
    --bg1:#0b1026; --bg2:#1b2559; --card:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.12); --text:#f4f6ff; --muted:#aab3d6; --accent:#5b8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    color:var(--text);
    background:radial-gradient(1200px 600px at 50% -10%,#2c3d8f 0%,transparent 60%),
               linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex;justify-content:center;padding:48px 18px 32px;
  }
  main{width:100%;max-width:440px;text-align:center}
  .avatar{
    width:104px;height:104px;margin:0 auto 18px;border-radius:50%;
    display:grid;place-items:center;font-size:38px;font-weight:700;letter-spacing:1px;
    background:linear-gradient(135deg,#5b8cff,#9b5bff);
    box-shadow:0 0 0 4px rgba(255,255,255,.12),0 12px 40px rgba(91,140,255,.45);
    direction:ltr;object-fit:cover;display:block;
  }
  h1{font-size:26px;font-weight:700}
  .latin{color:var(--muted);font-size:15px;margin-top:4px;direction:ltr}
  .bio{color:var(--muted);font-size:14px;margin:14px 0 28px}
  .links{display:flex;flex-direction:column;gap:14px}
  a.btn{
    display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    text-decoration:none;font-size:17px;font-weight:600;
    backdrop-filter:blur(8px);transition:transform .15s ease,background .15s ease,border-color .15s;
  }
  a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);outline:none}
  .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
  .ic svg{width:24px;height:24px;fill:#fff}
  .fb{background:#1877f2}
  .ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285aeb 90%)}
  .wa{background:#25d366}
  .tt{background:#000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .label{flex:1;text-align:right}
  .handle{display:block;font-size:12.5px;font-weight:400;color:var(--muted);direction:ltr;text-align:right}
  .arrow{opacity:.5;font-size:20px}
  footer{margin-top:36px;color:var(--muted);font-size:12px;direction:ltr}
</style>
